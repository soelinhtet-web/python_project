<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
 <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="{% static '../media/img/apple-icon.png' %}">
<link rel="shortcut icon" type="image/x-icon" href="{% static '../media/img/favicon.ico' %}">
<link rel="stylesheet" href="{% static '../media/css/bootstrap.css' %}">
<link rel="stylesheet" href="{% static '../media/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static '../media/css/templatemo.css' %}">
<link rel="stylesheet" href="{% static '../media/css/custom.css' %}">
<!-- Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
<link rel="stylesheet" href="{% static '../media/css/fontawesome.min.css' %}">

<link rel="stylesheet" href="{% static '../media/css/slick.min.css' %}">
<link rel="stylesheet" href="{% static '../media/css/slick-theme.css' %}">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
</head>
<body>
    
{% include 'components/header.html' %}

{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{message.tags}} alert-dismissible fade show auto-close" role="alert">
        {{message}}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
{% endif %}

<script>
    setTimeout(function () {
        let alerts = document.querySelectorAll(".auto-close");

        alerts.forEach(function(alert) {

            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();

        });

    }, 3000);
</script>

<main>
{% block body %}{% endblock %}
</main>

{% include 'components/footer.html' %}

    <!-- Start Script -->
<script src="{% static '../media/js/jquery-1.11.0.min.js' %}"></script>
<script src="{% static '../media/js/jquery-migrate-1.2.1.min.js' %}"></script>
<script src="{% static '../media/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static '../media/js/custom.js' %}"></script>
<script src="{% static '../media/js/bootstrap.js' %}"></script>
<script src="{% static '../media/js/templatemo.min.js' %}"></script>


<script src="{% static '../media/js/slick.min.js' %}"></script>

    <!-- End Script -->
<script>
window.addEventListener("load", function () {
    if (window.location.hash) {
        let el = document.querySelector(window.location.hash);

        if (el) {
            el.scrollIntoView({ behavior: "smooth" });
        }
    }
});
</script>
</body>
</html>
